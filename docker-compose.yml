services:
  db:
    image: postgres:16-alpine
    container_name: dealflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dealflow
      POSTGRES_PASSWORD: dealflow
      POSTGRES_DB: dealflow
    ports:
      - "${DEALFLOW_DB_PORT:-5432}:5432"
    volumes:
      - dealflow-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dealflow -d dealflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Production-style app container. Not started by `pnpm db:up`; run with `docker compose --profile app up --build`.
  app:
    profiles: ["app"]
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://dealflow:dealflow@db:5432/dealflow?schema=public
      APP_URL: ${APP_URL:-http://localhost:3000}
      DEALFLOW_DEMO_MODE: ${DEALFLOW_DEMO_MODE:-0}
      DEALFLOW_PUBLIC_SIGNUP: ${DEALFLOW_PUBLIC_SIGNUP:-0}
    command: ["sh", "-c", "node_modules/.bin/prisma migrate deploy && node_modules/.bin/next start"]
    ports:
      - "${DEALFLOW_APP_PORT:-3000}:3000"

volumes:
  dealflow-pgdata:
