<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 920" role="img" aria-labelledby="title desc">
  <title id="title">DealFlow360 architecture</title>
  <desc id="desc">Browser shell to Next.js 16 APIs, six engines, adapter decision, PostgreSQL 16.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7faf9"/>
      <stop offset="1" stop-color="#eef3f3"/>
    </linearGradient>
    <filter id="s" x="-4%" y="-6%" width="108%" height="118%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#183e46" flood-opacity=".08"/>
    </filter>
  </defs>
  <rect width="1280" height="920" fill="url(#bg)"/>
  <text x="40" y="42" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#132b3d">DealFlow360 architecture</text>
  <text x="40" y="66" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#60727d">One Next.js app, one PostgreSQL 16 database, session cookie auth, fail-closed adapters</text>
  <text x="780" y="42" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#aa382d">UNTRUSTED: browser / portal JSON</text>
  <text x="780" y="62" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#217653">TRUSTED: engines, Prisma, PostgreSQL</text>

  <!-- Browser -->
  <rect x="28" y="88" width="1224" height="168" rx="14" fill="#fffefa" stroke="#cfdcdf" filter="url(#s)"/>
  <text x="48" y="118" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4" fill="#087f80">LAYER 1 � BROWSER</text>
  <text x="48" y="142" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#132b3d">Application.tsx (root layout)</text>
  <text x="320" y="142" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#60727d">same-origin HTTPS � httpOnly cookie dealflow_session (not localStorage JWT)</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="48" y="160" width="370" height="72" rx="8" fill="#e9f4f3" stroke="#b7d6d5"/>
    <text x="64" y="186" font-size="13" font-weight="700" fill="#056466">Staff workspace</text>
    <text x="64" y="208" font-size="11" fill="#3f5665">/home � quotes � approvals � fulfillment � reports</text>
    <rect x="438" y="160" width="370" height="72" rx="8" fill="#e9f4f3" stroke="#b7d6d5"/>
    <text x="454" y="186" font-size="13" font-weight="700" fill="#056466">Customer portal</text>
    <text x="454" y="208" font-size="11" fill="#3f5665">/portal � quotes � orders � invoices (allowlist JSON)</text>
    <rect x="828" y="160" width="396" height="72" rx="8" fill="#e9f4f3" stroke="#b7d6d5"/>
    <text x="844" y="186" font-size="13" font-weight="700" fill="#056466">Auth / landing</text>
    <text x="844" y="208" font-size="11" fill="#3f5665">/ � /login � /signup � pending until admin activates</text>
  </g>

  <path d="M640 256 v28" stroke="#087f80" stroke-width="2"/>
  <polygon points="640,292 634,280 646,280" fill="#087f80"/>
  <text x="656" y="280" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#087f80">HTTPS + cookie</text>

  <!-- Next.js -->
  <rect x="28" y="300" width="1224" height="392" rx="14" fill="#fffefa" stroke="#cfdcdf" filter="url(#s)"/>
  <text x="48" y="330" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4" fill="#087f80">LAYER 2 � NEXT.JS 16 � NODE 24 RUNTIME</text>
  <text x="48" y="354" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#132b3d">Route handlers + canonical engines</text>

  <rect x="48" y="372" width="220" height="128" rx="8" fill="#132b3d"/>
  <text x="64" y="400" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#9fe3e2">middleware.ts</text>
  <text x="64" y="422" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#d6e8e8">matcher /api/*</text>
  <text x="64" y="442" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#ffffff">assertPostOrigin</text>
  <text x="64" y="462" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#9fe3e2">403 ORIGIN if mismatch</text>
  <text x="64" y="482" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#9fe3e2">prod requires Origin/Referer</text>

  <g font-family="Arial, Helvetica, sans-serif" font-size="11">
    <rect x="284" y="372" width="168" height="56" rx="7" fill="#fff" stroke="#cfdcdf"/>
    <text x="296" y="394" font-weight="700" fill="#132b3d">/api/auth</text>
    <text x="296" y="412" fill="#60727d">login me logout signup � Ruchir</text>
    <rect x="464" y="372" width="200" height="56" rx="7" fill="#fff" stroke="#cfdcdf"/>
    <text x="476" y="394" font-weight="700" fill="#132b3d">/api/[...path]</text>
    <text x="476" y="412" fill="#60727d">workspace actions portal recs</text>
    <rect x="676" y="372" width="200" height="56" rx="7" fill="#fff" stroke="#cfdcdf"/>
    <text x="688" y="394" font-weight="700" fill="#132b3d">Catalog / inventory</text>
    <text x="688" y="412" fill="#60727d">products stock fulfillment � Harsh</text>
    <rect x="888" y="372" width="168" height="56" rx="7" fill="#fff" stroke="#cfdcdf"/>
    <text x="900" y="394" font-weight="700" fill="#132b3d">Quotes / health</text>
    <text x="900" y="412" fill="#60727d">approvals policies � Atharva</text>
    <rect x="1068" y="372" width="156" height="56" rx="7" fill="#fff" stroke="#cfdcdf"/>
    <text x="1080" y="394" font-weight="700" fill="#132b3d">Billing</text>
    <text x="1080" y="412" fill="#60727d">invoices payments � Ruchir</text>
  </g>

  <rect x="284" y="444" width="620" height="88" rx="8" fill="#f3f8f8" stroke="#b7d6d5"/>
  <text x="300" y="468" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#056466">getAdapter()</text>
  <text x="300" y="490" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#3f5665">NODE_ENV ` production AND DEALFLOW_ADAPTER=development � DEV FIXTURE (JSON)</text>
  <text x="300" y="510" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#3f5665">else DATABASE_URL set � liveAdapter (Prisma) � else 503 INTEGRATION_REQUIRED</text>

  <rect x="920" y="444" width="304" height="88" rx="8" fill="#fff" stroke="#cfdcdf"/>
  <text x="936" y="468" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#132b3d">Commitment handoff</text>
  <text x="936" y="490" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#3f5665">confirmOrder � Order + init billing</text>
  <text x="936" y="508" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#3f5665">+ init fulfillment (0 reserved)</text>

  <text x="48" y="564" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2" fill="#087f80">SIX ENGINES (pure logic + services + repositories)</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="48" y="576" width="190" height="92" rx="8" fill="#087f80"/>
    <text x="64" y="600" font-size="12" font-weight="700" fill="#fff">E1 Governance</text>
    <text x="64" y="620" font-size="11" fill="#d6f3f2">Atharva</text>
    <text x="64" y="640" font-size="11" fill="#e8fafa">policy � chain � confirm</text>
    <rect x="250" y="576" width="190" height="92" rx="8" fill="#087f80"/>
    <text x="266" y="600" font-size="12" font-weight="700" fill="#fff">E2 Fulfillment</text>
    <text x="266" y="620" font-size="11" fill="#d6f3f2">Harsh</text>
    <text x="266" y="640" font-size="11" fill="#e8fafa">preview � allocate � ship</text>
    <rect x="452" y="576" width="190" height="92" rx="8" fill="#087f80"/>
    <text x="468" y="600" font-size="12" font-weight="700" fill="#fff">E3 Billing</text>
    <text x="468" y="620" font-size="11" fill="#d6f3f2">Ruchir</text>
    <text x="468" y="640" font-size="11" fill="#e8fafa">invoice � pay � subscribe</text>
    <rect x="654" y="576" width="190" height="92" rx="8" fill="#056466"/>
    <text x="670" y="600" font-size="12" font-weight="700" fill="#fff">E4 Recommendations</text>
    <text x="670" y="620" font-size="11" fill="#d6f3f2">Krishna</text>
    <text x="670" y="640" font-size="11" fill="#e8fafa">rank add-ons � rules</text>
    <rect x="856" y="576" width="174" height="92" rx="8" fill="#056466"/>
    <text x="872" y="600" font-size="12" font-weight="700" fill="#fff">E5 Health</text>
    <text x="872" y="620" font-size="11" fill="#d6f3f2">Atharva</text>
    <text x="872" y="640" font-size="11" fill="#e8fafa">flags � tasks � refresh</text>
    <rect x="1042" y="576" width="182" height="92" rx="8" fill="#056466"/>
    <text x="1058" y="600" font-size="12" font-weight="700" fill="#fff">E6 Negotiation</text>
    <text x="1058" y="620" font-size="11" fill="#d6f3f2">Krishna</text>
    <text x="1058" y="640" font-size="11" fill="#e8fafa">propose � date � confirm</text>
  </g>

  <path d="M640 692 v28" stroke="#087f80" stroke-width="2"/>
  <polygon points="640,728 634,716 646,716" fill="#087f80"/>
  <text x="656" y="716" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#087f80">Prisma Client</text>

  <!-- DB -->
  <rect x="28" y="736" width="1224" height="152" rx="14" fill="#132b3d" filter="url(#s)"/>
  <text x="48" y="768" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4" fill="#9fe3e2">LAYER 3 � POSTGRESQL 16 � PRISMA 7.10</text>
  <text x="48" y="792" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Single database � additive migrations � Decimal money</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#d6e8e8">
    <rect x="48" y="812" width="140" height="48" rx="6" fill="#1c3d4e"/>
    <text x="62" y="841">Users � Sessions</text>
    <rect x="200" y="812" width="150" height="48" rx="6" fill="#1c3d4e"/>
    <text x="214" y="841">Catalog � Price lists</text>
    <rect x="362" y="812" width="170" height="48" rx="6" fill="#1c3d4e"/>
    <text x="376" y="841">Quotes � Revisions</text>
    <rect x="544" y="812" width="150" height="48" rx="6" fill="#1c3d4e"/>
    <text x="558" y="841">Orders � Stock</text>
    <rect x="706" y="812" width="160" height="48" rx="6" fill="#1c3d4e"/>
    <text x="720" y="841">Invoices � Payments</text>
    <rect x="878" y="812" width="150" height="48" rx="6" fill="#1c3d4e"/>
    <text x="892" y="841">Health � Tasks</text>
    <rect x="1040" y="812" width="184" height="48" rx="6" fill="#1c3d4e"/>
    <text x="1054" y="841">RequestKey � AuditEvent</text>
  </g>
</svg>
